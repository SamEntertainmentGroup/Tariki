name: Build Android APK
# Fabrique l'APK à installer pour les tests et l'AAB à envoyer sur le Play Store, signés avec la même clé.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ALERTS_URL: https://tariki.app/wp-admin/admin-ajax.php

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run self-tests
        run: python3 -m unittest discover -s tests -v

      - name: Check alerts server URL
        run: |
          case "$ALERTS_URL" in
            https://*) ;;
            *) echo "ALERTS_URL doit commencer par https://"; exit 1 ;;
          esac

      # La carte, le fond et les itinéraires ne sont pas dans l'APK : l'appli les télécharge au premier lancement.
      - name: Check data the app will download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in map-latest:algeria-map.mbtiles map-latest:algeria-base.geojson.gz routes-latest:algeria-routing.bin.gz; do
            tag=${pair%%:*}
            file=${pair#*:}
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$file"; then
              echo "OK : $tag/$file"
            else
              echo "::warning::$file absent de la Release $tag : lancez d'abord le workflow de la carte ou des itinéraires."
            fi
          done

      - name: Download label fonts
        shell: bash
        run: |
          python3 tools/fetch_glyphs.py --output android/app/src/main/assets/glyphs | tee glyph-report.txt
          { echo '```'; cat glyph-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tariki.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/tariki.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            # Liste les noms de clés du fichier et l'empreinte SHA1, à comparer avec la Play Console
            # (Intégrité de l'application, certificat de la clé d'importation).
            keytool -list -v -keystore "$RUNNER_TEMP/tariki.keystore" -storepass "$KEYSTORE_PASSWORD" | grep -iE "alias|SHA1" || true
          else
            echo "::error::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD absents : sans la clé d'envoi, le Play Store refuse l'AAB."
            exit 1
          fi

      - name: Build APK and AAB
        working-directory: android
        run: |
          releases="https://github.com/$GITHUB_REPOSITORY/releases/download"
          # Le Play Store a déjà le versionCode 6 (version de test) : on part de 100.
          version_code=$((100 + GITHUB_RUN_NUMBER))
          echo "versionCode : $version_code" >> "$GITHUB_STEP_SUMMARY"
          gradle assembleRelease bundleRelease --no-daemon --stacktrace \
            -PalertsUrl="$ALERTS_URL" \
            -PmapUrl="$releases/map-latest/algeria-map.mbtiles" \
            -PbaseUrl="$releases/map-latest/algeria-base.geojson.gz" \
            -ProutingUrl="$releases/routes-latest/algeria-routing.bin.gz" \
            -PversionCodeOverride="$version_code"

      - name: Check APK content
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          for entry in assets/style.json assets/glyphs/NotoSans-Regular/0-255.pbf; do
            unzip -l "$APK" | grep -q "$entry" || { echo "Manquant dans l'APK : $entry"; exit 1; }
          done
          echo "Contenu de l'APK vérifié"
          ls -l android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tariki-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: tariki-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
